# Independent CVD Programs - manually submitted, not managed on any platform
# See the "Submitting a Program" section in the README for field details
#
# Required fields: company, url
# Optional fields: contact, rewards, min_payout, max_payout, currency,
#   safe_harbor, allows_disclosure, domains, pgp_key, preferred_languages,
#   description, program_type, status, scope, out_of_scope, testing_policy_url,
#   excluded_methods, requires_account, payout_table, disclosure_timeline_days,
#   response_sla_days, legal_terms_url, hall_of_fame_url, swag_details,
#   reporting_url, standards

companies:

- company: Abhieo
  url: https://www.abhieo.in/bug-bounty
  contact: mailto:security@abhieo.in
  rewards:
  - '*bounty'
  program_type: bounty
  status: active
  safe_harbor: full
  allows_disclosure: false
  preferred_languages: English
  description: |-
    Rules of Engagement
    ✅ DO:
    Use Your Own Accounts: Only test with accounts you own or have explicit permission to access
    Report First: Submit vulnerabilities to us before public disclosure
    Be Professional: Maintain professional and respectful communication
    Provide Details: Include comprehensive reproduction steps, proof of concept, and impact assessment
    Give Us Time: Allow reasonable time for investigation and fix (typically 90 days)
  excluded_methods:
  - dos
  - social_engineering
  - phishing
  - physical_access
  - automated_scanning
  out_of_scope:
  - Third-party services and platforms (payment gateways, SMS providers, email services)
  - Service Provider systems (mobile operators, DTH providers, billers)
  - Social media profiles and pages
  - Physical security of ABHIEO offices
  - Employee email accounts (unless demonstrating a critical vulnerability)
  - Staging/development/test environments (unless critical server-level vulnerabilities)
  - Issues in archived or deprecated services
  domains:
  - www.abhieo.in (Main website)
  - All subdomains (*.abhieo.in)
  - Web application APIs
  - Payment gateways integration
  - RESTful APIs
  - Authentication & Authorization APIs
  - Transaction processing APIs
  - User management APIs
  - ABHIEO Android App (Google Play Store)
  - ABHIEO iOS App (Apple App Store)
  - All mobile app APIs and endpoints
  - Payment processing workflows
  - Wallet functionality
  - Transaction verification systems
  - Refund mechanisms
  min_payout: 500
  max_payout: 50000
  currency: INR
  payout_table:
    critical: 50000
    high: 20000
    medium: 10000
    low: 500
  response_sla_days: 3
  disclosure_timeline_days: 90
  testing_policy_url: https://www.abhieo.in/bug-bounty
  requires_account: true

- company: Ably
  url: https://ably.com/disclosure
  contact: mailto:disclosure@ably.com
  rewards:
  - '*bounty'
  - '*recognition'
  program_type: bounty
  status: active
  safe_harbor: full
  allows_disclosure: true
  preferred_languages: English
  description: Ably runs its own disclosure programme covering its website, ancillary *.ably.com sites and the production realtime and REST endpoints. Rewards start from a CVSS-informed severity assessment and can be paid to charity instead of the researcher. Only the first responsible disclosure of an issue is eligible, and reports generated solely by AI are not accepted.
  excluded_methods:
  - dos
  - phishing
  - physical_access
  scope:
  - target: ably.com
    type: web
  - target: '*.ably.com'
    type: web
  - target: main.realtime.ably.net
    type: api
  - target: '*.realtime.ably.net'
    type: api
  - target: realtime.ably.io
    type: api
  - target: rest.ably.io
    type: api
  - target: Ably service endpoints served from customer domains via CNAME
    type: api
  out_of_scope:
  - Ably subdomains served by third parties, such as support.ably.com
  - Domains and services that are not customer facing
  - Third-party functionality surfaced on the website, such as interactive support chat
  - Reports relating to ably-cli
  - Username enumeration
  - Missing rate limits that do not signify a security issue
  - Security header configuration and missing headers
  - TLS configuration and known protocol, ciphersuite or certificate weaknesses
  - SPF, DKIM and DMARC configuration suggestions
  - Known vulnerable libraries without a working proof of concept
  min_payout: 150
  max_payout: 5000
  currency: USD
  payout_table:
    critical: 5000
    high: 1500
    medium: 500
    low: 150
  hall_of_fame_url: https://ably.com/acknowledgements

- company: Airwallex
  url: https://help.airwallex.com/hc/en-gb/articles/900004502526-Bug-Bounty-Program-Rules
  contact: mailto:bugbounty@airwallex.com
  rewards:
  - '*bounty'
  program_type: bounty
  status: active
  preferred_languages: English
  description: Airwallex maintains a bug bounty program for Airwallex owned web properties. Any design or implementation issue that substantially affects the confidentiality or integrity of user data is likely to be in scope, limited to technical vulnerabilities in Airwallex owned or used web applications. Reward amounts are chosen at the discretion of the reward panel, and are awarded on a first-come, first-served basis.
  excluded_methods:
  - dos
  - social_engineering
  - automated_scanning
  out_of_scope:
  - Disclosure of known public files or directories (e.g. robots.txt)
  - Clickjacking and issues only exploitable through clickjacking
  - CSRF on forms available to anonymous users, CSRF attacks requiring knowledge of the CSRF token, and logout CSRF
  - Content spoofing
  - Login or forgot password page brute force, and account lockout not enforced
  - OPTIONS HTTP method enabled
  - Username / email enumeration
  - Missing HTTP security headers
  - HTTP/DNS cache poisoning
  - SSL/TLS issues such as BEAST, BREACH, renegotiation attacks, missing forward secrecy and weak cipher suites
  - Self-XSS, and any XSS where local access is required
  - Missing or incorrect SPF or DMARC records of any kind
  - Source code disclosure vulnerabilities
  - Information disclosure of non-confidential information
  - Email bombing/flooding/rate limiting
  domains:
  - '*.airwallex.com'

